[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "doom-assistant"
version = "0.1.0"
description = "A lightweight, modular, local-first AI coding companion powered by Ollama."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Shami Ahmed" }
]
dependencies = [
    "ollama>=0.1.7",
    "rich>=13.7.0",
    "pydantic>=2.0.0",
]

[project.scripts]
doom = "main:cli_entry"

[tool.setuptools]
py-modules = ["main", "context", "ollama_client", "prompts", "runner", "snapshots", "storage", "mcp_client"]